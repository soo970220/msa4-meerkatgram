spring:
  application:
    name: msa4-meerkatgram
    version: v1

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

  # DB
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 커넥션 풀 설정
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000

  # JPA
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: false
        default_batch_fetch_size: 100
    defer-datasource-initialization: true
  sql:
    init:
      data-locations: classpath*:dummy/*.sql
      mode: never
      platform: all

server:
  error:
    include-stacktrace: never
    include-message: never

# Springdoc Openapi
springdoc:
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
  api-docs:
    path: /api-docs

# Log
logging:
  file:
    name: logs/error.log
  level:
    root: error
    com.msa4spring.controllers: error

# Security & JWT
security:
  jwt:
    secure: false
    issuer: meerkat@meerkat.kr
    type: JWT
    access-token-expiry: 100000000
    refresh-token-expiry: 1296000000
    refresh-token-cookie-name: refresh-token
    refresh-token-cookie-expiry: 1296000
    secret: ${JWT_SECRET}
    header-key: Authorization
    scheme: Bearer
    reissue-uri: /api/reissue-token

# file
file:
  server-uri: ${SERVER_URI:http://localhost:8080}
  storage-path: /storage
  profile-path: /files/profiles
  post-path: /files/posts
  allow-extension-list: [
    "image/jpg",
    "image/jpeg",
    "image/png",
    "image/gif",
    "image/svg",
    "image/webp"
  ]

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}
  max-age: 3600